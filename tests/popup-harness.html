<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Bars popup — dev harness</title>
  <link rel="stylesheet" href="../extension/popup/popup.css">
  <style>body { border: 1px solid #ccc; margin: 16px; } </style>
</head>
<body>
  <!-- Dev-only: runs the real popup against the in-memory fake. ?recovery=1 shows the recovery screen. -->
  <main id="app" aria-live="polite"></main>
  <p id="error" class="error" role="alert" hidden></p>
  <footer id="footer" class="muted"></footer>
  <script type="module">
    import { createFakeChrome } from './fake-chrome.js';
    import { createController } from '../extension/lib/controller.js';
    import { readState, writeState } from '../extension/lib/store.js';
    const params = new URLSearchParams(location.search);
    const focusBars = [{ title: 'Focus Bars', children: [{ title: 'General', children: [] }, { title: 'Dev', children: [{ title: 'GitHub', url: 'https://github.com/' }] }, { title: 'Music', children: [] }] }];
    const shown = [{ title: 'Inbox', url: 'https://mail/' }, { title: 'Calendar', url: 'https://cal/' }];
    // ?device=1: a signed-in profile with account bookmarks, plus items saved only on this device.
    const device = params.has('device');
    const api = createFakeChrome(device
      ? { bar: [{ title: 'Old news', url: 'https://news/' }, { title: 'Recipes', children: [] }, { title: 'Bank', url: 'https://bank/' }], account: { bar: shown, other: focusBars }, windows: [{ id: 1, focused: true, tabs: ['https://mail/'] }] }
      : { bar: shown, other: focusBars, windows: [{ id: 1, focused: true, tabs: ['https://mail/'] }] });
    const id = (t) => api._id(t);
    const barId = device ? id('Bookmarks Bar') : '1';
    await writeState(api.storage.local, { version: 1, barId, rootId: id('Focus Bars'), generalId: id('General'), focusIds: [id('General'), id('Dev'), id('Music')], activeId: id('General'), journal: null, needsRecovery: params.has('recovery'), prints: {}, lastSwapMs: 12 });
    const ctl = createController(api);
    await ctl.boot();
    await ctl.restoreWindows();
    globalThis.chrome = {
      ...api,
      tabs: { ...api.tabs, create: async ({ url }) => { document.title = `opened ${url}`; } },
      runtime: { sendMessage: (msg) => ctl.handleMessage(msg).then((result) => ({ ok: true, result }), (e) => ({ ok: false, error: e.message })) },
    };
    globalThis.fake = api;
    await import('../extension/popup/popup.js');
  </script>
</body>
</html>
